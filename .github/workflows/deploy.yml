name: Build and deploy GuideHollow Ready (Astro)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guidehollow-ready-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify Coupang partner HTML parser safety
        run: node --experimental-strip-types scripts/test-partner-code.mjs
      - name: Test preparedness stock dates and backup validation
        run: node --experimental-strip-types scripts/test-preparedness-stock.mjs
      - name: Install dependencies
        run: npm ci
      - name: Astro type check
        run: npm run check
      - name: Build static pages
        run: npm run build
      - name: Verify navigation, official safety links, Naver meta and draft isolation
        run: npm run verify
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  responsive-audit:
    name: Mobile and desktop QA (non-blocking)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site for browser checks
        run: npm run build
      - name: Install browser automation package
        timeout-minutes: 2
        run: npm install --no-save --package-lock=false --no-audit --no-fund --prefer-offline playwright-core@1.56.1
      - name: Test responsive layout and interactions
        timeout-minutes: 3
        run: node scripts/test-responsive-layout.mjs
      - name: Preserve QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-responsive-qa
          path: .qa-screenshots
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
